# Render blueprint: provisions PostgreSQL and the NestJS API together.
# Dashboard → New → Blueprint → point at this repo.
databases:
  - name: jmit-pm-db
    databaseName: jmit_pm
    user: jmit
    plan: free

services:
  - type: web
    name: jmit-pm-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jmit-pm-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        value: https://ark143.github.io
      - key: NODE_ENV
        value: production
